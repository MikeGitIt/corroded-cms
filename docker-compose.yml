services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corroded
      POSTGRES_PASSWORD: corroded
      POSTGRES_DB: corroded_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corroded -d corroded_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
