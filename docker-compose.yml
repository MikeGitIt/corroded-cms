services:
  app:
    build: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://corroded:corroded@postgres:5432/corroded_cms
      BASE_URL: http://127.0.0.1:3000
      SESSION_SECRET: dev-only-change-me-to-at-least-32-bytes
      UPLOAD_DIR: /app/uploads
      ENVIRONMENT: development
      SITE_NAME: GigaTier Technologies
      SITE_DESCRIPTION: Autonomous C/C++ to Rust transpilation. Verified, validated, delivered.
      THEME: gigatier
      RUST_LOG: corroded_cms=info,tower_http=info
      HOST: 0.0.0.0
      PORT: "3000"
      MAX_UPLOAD_BYTES: "5242880"
    ports:
      - "3000:3000"
    volumes:
      - uploads-data:/app/uploads

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: corroded
      POSTGRES_PASSWORD: corroded
      POSTGRES_DB: corroded_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corroded -d corroded_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  uploads-data:
